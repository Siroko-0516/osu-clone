name: Browser port build
on:
  push:
    branches: [web-port]
    paths:
      - 'osu.Web/**'
      - 'osu.Web.Probe/**'
      - 'osu.Game/osu.Game.csproj'
      - 'WEB_PORTING.md'
      - '.github/workflows/web-port.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  wasm-host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout osu
        uses: actions/checkout@v4

      - name: Checkout browser framework fork
        uses: actions/checkout@v4
        with:
          repository: Siroko-0516/osu-framework-clone
          ref: web-port
          path: osu-framework-clone

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - run: dotnet workload install wasm-tools

      - name: Build osu.Game against browser framework
        run: dotnet build osu.Web.Probe/osu.Web.Probe.csproj -c Release -p:OsuBrowserBuild=true -p:WasmBuildNative=false

      - name: Publish interpreted WebAssembly host
        run: dotnet publish osu.Web/osu.Web.csproj -c Release -o artifacts/web -p:OsuBrowserBuild=true -p:WasmBuildNative=false

      - name: Configure GitHub Pages base path
        run: sed -i 's|<base href="/">|<base href="/osu-clone/">|' artifacts/web/wwwroot/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: osu-web-framework-integration
          path: artifacts/web/wwwroot

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/web/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: wasm-host
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
