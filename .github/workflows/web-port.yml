name: Browser port build
on:
  push:
    branches: [web-port]
    paths:
      - 'osu.Web/**'
      - 'osu.Web.Probe/**'
      - 'osu.Web.Storage.Tests/**'
      - 'osu.Web.Settings.Tests/**'
      - 'osu.Game/**'
      - 'WEB_PORTING.md'
      - '.github/workflows/web-port.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  wasm-host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout osu
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate browser JavaScript syntax
        run: node --check osu.Web/wwwroot/js/browserHost.js

      - name: Verify browser metadata storage contracts
        working-directory: osu.Web.Storage.Tests
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Checkout browser framework fork
        uses: actions/checkout@v4
        with:
          repository: Siroko-0516/osu-framework-clone
          # Keep the game and framework pair reproducible while both ports evolve.
          ref: 410b83775f315f7a6e96cb2ebd715fbae07f47d5
          path: osu-framework-clone

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - run: dotnet workload install wasm-tools

      - name: Build osu.Game against browser framework
        run: dotnet build osu.Web.Probe/osu.Web.Probe.csproj -c Release -p:OsuBrowserBuild=true -p:WasmBuildNative=false

      - name: Verify original ruleset settings without Realm
        run: |
          dotnet build osu.Web.Settings.Tests/osu.Web.Settings.Tests.csproj -c Release -p:OsuBrowserBuild=true -p:WasmBuildNative=false
          dotnet osu.Web.Settings.Tests/bin/Release/net8.0/osu.Web.Settings.Tests.dll

      - name: Publish interpreted WebAssembly host
        run: dotnet publish osu.Web/osu.Web.csproj -c Release -o artifacts/web -p:OsuBrowserBuild=true -p:WasmBuildNative=false

      - name: Configure GitHub Pages base path
        run: sed -i 's|<base href="/">|<base href="/osu-clone/">|' artifacts/web/wwwroot/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: osu-web-framework-integration
          path: artifacts/web/wwwroot

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/web/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: wasm-host
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
