name: Browser port build
on:
  push:
    branches: [web-port]
    paths:
      - 'osu.Web/**'
      - 'WEB_PORTING.md'
      - '.github/workflows/web-port.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wasm-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet workload install wasm-tools
      - run: dotnet publish osu.Web/osu.Web.csproj -c Release -o artifacts/web
      - uses: actions/upload-artifact@v4
        with:
          name: osu-web-phase-0
          path: artifacts/web/wwwroot
