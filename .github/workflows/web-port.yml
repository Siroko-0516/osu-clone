name: Browser port build
on:
  push:
    branches: [web-port]
    paths:
      - 'osu.Web/**'
      - 'osu.Web.Probe/**'
      - 'WEB_PORTING.md'
      - '.github/workflows/web-port.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wasm-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet workload install wasm-tools
      - name: Build standalone browser host
        run: dotnet publish osu.Web/osu.Web.csproj -c Release -o artifacts/web
      - name: Probe full osu.Game browser compatibility
        id: game-probe
        continue-on-error: true
        run: dotnet build osu.Web.Probe/osu.Web.Probe.csproj -c Release
      - name: Record probe result
        run: echo "osu.Game browser compatibility probe outcome: ${{ steps.game-probe.outcome }}" > artifacts/web/compatibility-probe.txt
      - uses: actions/upload-artifact@v4
        with:
          name: osu-web-phase-0
          path: artifacts/web/wwwroot
